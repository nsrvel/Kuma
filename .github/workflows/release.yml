name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release DMG
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
        run: |
          chmod +x Scripts/make-dmg.sh
          ./Scripts/make-dmg.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kuma-*.dmg
          generate_release_notes: true
