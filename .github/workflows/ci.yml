name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    timeout-minutes: 20
    # objectVersion 77 requires Xcode 16+ (macos-14 images ship Xcode 15.4).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Kuma.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('Kuma.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Kuma/**/*.swift', 'KumaTests/**/*.swift') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Resolve Swift packages
        run: xcodebuild -scheme Kuma -resolvePackageDependencies -clonedSourcePackagesDirPath .spm

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Kuma \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build/DerivedData \
            build-for-testing

      - name: Test without building
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Kuma \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build/DerivedData \
            -resultBundlePath TestResults.xcresult \
            -maximum-test-execution-time-allowance 120 \
            -parallel-testing-worker-count 4 \
            test-without-building

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
